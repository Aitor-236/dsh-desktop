appId: io.github.aitor236.dsh-desktop
productName: DeepSeek Harness
copyright: Copyright © 2026 Aitor

directories:
  output: dist
  buildResources: build

# GitHub Releases 作为更新源：打包时会生成 app-update.yml 与 latest-linux.yml
publish:
  provider: github
  owner: Aitor-236
  repo: dsh-desktop
  # 默认值是 draft，而草稿 release 对 electron-updater 不可见 —— 必须是正式发布
  releaseType: release

files:
  - src/**/*
  - package.json

linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: build/icons
  executableName: dsh-desktop
  syncDesktopName: true
  synopsis: DeepSeek Harness 桌面端（dsh web 的 Linux 桌面壳）
  description: DeepSeek Harness（dsh）的 Linux 桌面壳：内置管理 dsh web 服务，自启动、托盘常驻、关闭到托盘、开机自启、一键重启与日志查看。
  desktop:
    entry:
      Name: DeepSeek Harness
      Comment: DeepSeek Harness（dsh）智能体桌面端
      Keywords: ai;agent;deepseek;dsh;harness;chat;code;

appImage:
  artifactName: DeepSeek-Harness-${version}-${arch}.AppImage

deb:
  artifactName: DeepSeek-Harness-${version}-${arch}.deb
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
