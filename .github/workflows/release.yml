name: Release (Linux desktop)

# 打 tag 推送即发布：CI 构建 AppImage + deb，并把资产与 latest-linux.yml 传进 GitHub Releases。
# 手动触发（workflow_dispatch）只构建不发布，方便先验证 CI 能不能出包。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: 安装打包依赖
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot

      - name: 安装依赖
        run: npm ci

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package.json 里的版本 v${version} 不一致，请先升版本再打 tag"
            exit 1
          fi
          echo "将要发布 v${version}"

      - name: 单元测试
        run: npm test

      - name: 构建（tag 推送时同时发布）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            npx electron-builder --linux AppImage deb --publish always
          else
            echo "非 tag 触发：只构建，不发布"
            npx electron-builder --linux AppImage deb
          fi

      - name: 上传构建产物（仅手动触发时留档）
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml
          if-no-files-found: error
